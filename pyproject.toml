[project]
name = "wnacg-downloader"
version = "0.1.0"
description = "Multi-site manga/comic downloader with PySide2 GUI"
requires-python = ">=3.7,<3.11"
dependencies = [
    "PySide2>=5.15.2",
    "beautifulsoup4>=4.10.0",
    "requests>=2.28.1",
    "browser-cookie3>=0.19.1",
    "rookiepy>=0.5.6",
    "pycryptodome>=3.15.0",
    "Pillow>=8.4.0",
    "discord.py",
    "zipfile2>=0.0.12",
    "undetected-chromedriver>=3.5.0",
]

[project.scripts]
downloader = "main:main"


[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
